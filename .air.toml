# Air configuration for llama-swap development
# 运行: air -c .air.toml

root = "."
tmp_dir = "tmp"

[build]
  bin = "./tmp/llama-swap"
  cmd = "go build -tags embed_ui -ldflags=\"-X main.commit=dev -X main.version=dev -X main.date=$(date -u +'%Y-%m-%dT%H:%M:%SZ')\" -o ./tmp/llama-swap ."
  delay = 1000
  exclude_dir = ["tmp", "ui-svelte", "build", "vendor"]
  include_ext = ["go", "yaml", "json"]
  exclude_file = []
  exclude_regex = []
  exclude_unchanged = false
  follow_symlink = false
  full_bin = "./tmp/llama-swap --config /home/hyzx86/ai/llama-swap/config.yaml --listen 0.0.0.0:8080 --watch-config"
  include_dir = ["internal", "cmd", "."]
  kill_delay = "0s"
  log = "air.log"
  poll = false
  send_interrupt = false
  stop_on_error = false

[color]
  app = ""
  build = "yellow"
  main = "magenta"
  runner = "green"
  watcher = "cyan"

[log]
  time = false

[misc]
  clean_on_exit = false
